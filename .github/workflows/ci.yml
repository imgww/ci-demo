name: CI/CD Demo

# 触发条件：push / PR 到 main 时自动运行，也可手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支产生新提交时，自动取消还在跑的旧流水线
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===== 阶段一：CI —— 多版本 Node 下跑质量关卡 =====
  ci:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # ===== 阶段二：构建 —— 只构建一次，产物供部署复用 =====
  build:
    name: Build artifact
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ===== 阶段三：CD —— Docker 容器化部署 =====
  # 服务器配国内镜像加速（海外 registry 不可达），部署 = 上传构建上下文 + 服务器 docker build + 容器化运行
  deploy:
    name: Deploy via Docker
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload Docker build context to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: |
            package.json
            package-lock.json
            index.html
            build.js
            server.mjs
            Dockerfile
            .dockerignore
            src
          target: "/var/www/ci-demo/docker"

      - name: Build & run container on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/ci-demo/docker
            docker build -t ci-demo:latest .
            docker rm -f ci-demo >/dev/null 2>&1 || true
            pm2 delete ci-demo >/dev/null 2>&1 || true
            docker run -d --name ci-demo --restart unless-stopped -p 3000:3000 ci-demo:latest