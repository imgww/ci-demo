name: CI/CD Demo

# 触发条件：push / PR 到 main 时自动运行，也可手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支产生新提交时，自动取消还在跑的旧流水线
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===== 阶段一：CI —— 多版本 Node 下跑质量关卡 =====
  ci:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # ===== 阶段二：构建 —— 只构建一次，产物供部署复用 =====
  build:
    name: Build artifact
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ===== 阶段三：CD —— Docker 容器化部署 =====
  # 服务器海外数据面不可达（scp 大流量/海外 registry 数据流均被截断）→ 部署 = 服务器按 commit SHA
  # 从 jsDelivr（国内 CDN，已验证数据流可达）拉取仓库源码 + 本机 docker build（基础镜像走国内加速器）+ 容器化运行
  deploy:
    name: Deploy via Docker
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy container on server (build from source via jsDelivr mirror)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          retry: 2
          script: |
            set -e
            SHA=${{ github.sha }}
            APP=/var/www/ci-demo/docker
            rm -rf $APP/* 2>/dev/null || true
            mkdir -p $APP/src
            cd $APP
            BASE="https://cdn.jsdelivr.net/gh/imgww/ci-demo@$SHA"
            for f in Dockerfile server.mjs package.json package-lock.json index.html build.js; do
              curl --retry 5 --retry-delay 10 -fsSL --max-time 120 "$BASE/$f" -o "$f"
            done
            curl --retry 5 --retry-delay 10 -fsSL --max-time 120 "$BASE/src/math.js" -o src/math.js
            curl --retry 5 --retry-delay 10 -fsSL --max-time 120 "$BASE/src/index.js" -o src/index.js
            docker build -t ci-demo:latest .
            docker rm -f ci-demo >/dev/null 2>&1 || true
            pm2 delete ci-demo >/dev/null 2>&1 || true
            docker run -d --name ci-demo --restart unless-stopped -p 3000:3000 ci-demo:latest
            sleep 2
            curl -s -o /dev/null -w "deploy http check: %{http_code}\n" --max-time 10 http://localhost:3000
            docker ps --filter name=ci-demo --format "container: {{.Status}}"