name: CI/CD Demo

# 触发条件：push / PR 到 main 时自动运行，也可手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支产生新提交时，自动取消还在跑的旧流水线
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===== 阶段一：CI —— 多版本 Node 下跑质量关卡 =====
  ci:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # ===== 阶段二：构建 —— 只构建一次，产物供部署复用 =====
  build:
    name: Build artifact
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ===== 阶段三：CD —— Docker 容器化部署 =====
  # runner 构建镜像 → docker save 压缩 → scp 直传服务器 → docker load + 容器化运行
  # （服务器无法稳定访问 ghcr.io/Docker Hub 拉取，镜像以传输方式交付，替代 scp + pm2）
  deploy:
    name: Deploy via Docker
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ci-demo:latest

      - name: Save & compress image
        run: |
          mkdir -p /tmp/deploy
          docker save ci-demo:latest | gzip -1 > /tmp/deploy/ci-demo.tar.gz
          du -h /tmp/deploy/ci-demo.tar.gz

      - name: Upload image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "/tmp/deploy/ci-demo.tar.gz"
          target: "/tmp/ci-demo-deploy"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            pm2 delete ci-demo >/dev/null 2>&1 || true
            mkdir -p /tmp/ci-demo-deploy
            docker load -i /tmp/ci-demo-deploy/ci-demo.tar.gz
            docker rm -f ci-demo >/dev/null 2>&1 || true
            docker run -d --name ci-demo --restart unless-stopped -p 3000:3000 ci-demo:latest